# Everything OpenFrontDesk needs, locally: `docker compose up -d --build`
# Infrastructure: Postgres (pgvector + pg_textsearch), Redis, LiveKit (+ SIP).
# Apps: api (serves the dashboard too), worker, voice-worker, web.

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://ofd:ofd@postgres:5432/ofd
  REDIS_URL: redis://redis:6379
  LIVEKIT_URL: ws://livekit:7880
  LIVEKIT_API_KEY: devkey
  LIVEKIT_API_SECRET: secret-secret-secret-secret-secret-0
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-change-me-dev-only-change-me}
  BETTER_AUTH_URL: http://localhost:3000
  PUBLIC_APP_URL: http://localhost:3000
  OFD_DEFAULT_MODEL: ${OFD_DEFAULT_MODEL:-openai/gpt-5-mini}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
  CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
  KAPSO_API_KEY: ${KAPSO_API_KEY:-}
  KAPSO_BASE_URL: ${KAPSO_BASE_URL:-}
  KAPSO_PHONE_NUMBER_ID: ${KAPSO_PHONE_NUMBER_ID:-}
  LIVEKIT_SIP_TRUNK_ID: ${LIVEKIT_SIP_TRUNK_ID:-}
  OFD_INBOUND_ORG_ID: ${OFD_INBOUND_ORG_ID:-}
  OFD_INBOUND_BOT_VERSION_ID: ${OFD_INBOUND_BOT_VERSION_ID:-}
  HUBSPOT_TOKEN: ${HUBSPOT_TOKEN:-}
  KOMMO_TOKEN: ${KOMMO_TOKEN:-}
  KOMMO_BASE_URL: ${KOMMO_BASE_URL:-}
  OFD_TIMEZONE: ${OFD_TIMEZONE:-America/Argentina/Buenos_Aires}

services:
  postgres:
    build: ./docker/postgres
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb,pg_textsearch"]
    environment:
      POSTGRES_USER: ofd
      POSTGRES_PASSWORD: ofd
      POSTGRES_DB: ofd
    ports: ["5432:5432"]
    volumes: ["pgdata:/home/postgres/pgdata"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofd -d ofd"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  livekit:
    image: livekit/livekit-server:latest
    command: ["--config", "/etc/livekit.yaml"]
    volumes: ["./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro"]
    ports: ["7880:7880", "7881:7881", "50000-50100:50000-50100/udp"]
    depends_on:
      redis: { condition: service_healthy }

  migrate:
    build: { context: ., target: api }
    command: ["node", "dist/migrate.js"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., target: api }
    environment:
      <<: *app-env
      OFD_MIGRATE_ON_BOOT: "false"
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10

  worker:
    build: { context: ., target: worker }
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  voice-worker:
    build: { context: ., target: voice-worker }
    environment:
      <<: *app-env
      LIVEKIT_SIP_TRUNK_ID: ${LIVEKIT_SIP_TRUNK_ID:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      livekit: { condition: service_started }
    profiles: ["voice"]

  web:
    build: { context: ., target: web }
    ports: ["3002:3002"]

volumes:
  pgdata:
