name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://ofd:ofd@localhost:5432/ofd
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The same Postgres image (pgvector + pg_textsearch) and Redis that docker compose runs.
      - run: docker compose up -d --wait postgres redis
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm turbo run build typecheck test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api worker web
